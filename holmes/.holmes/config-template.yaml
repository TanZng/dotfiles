model: "litellm_proxy/claude-sonnet-4-6"
fast_model: "litellm_proxy/claude-haiku-4-5"
max_steps: 70

mcp_servers:
  grafana:
    description: "Grafana observability and dashboards"
    config:
      url: "http://grafana-mcp:8000/mcp"
      mode: streamable-http
    icon_url: "https://cdn.simpleicons.org/grafana/F46800"

  buildkite:
    description: "CI/CD System"
    config:
      url: "http://buildkite-mcp:3000/mcp"
      mode: streamable-http
    icon_url: "https://buildkite.com/_astro/buildkite-mark.D56ywXpU.svg"

toolsets:
  bash:
    enabled: true
    config:
      builtin_allowlist: "extended"
      allow:
        - "gh"
        - "aws"
        - "sed"
        - "awk"
        - "psql"

  # DISABLED — these are Kubernetes *write* actions (restart/scale/rollback/cordon).
  # They were meant to pause for a Slack Approve/Deny gate, but Holmes does not honor
  # that approval protocol over /api/chat: it just runs the tool. With no working gate,
  # ungated cluster writes are unsafe, so this toolset stays off. Re-enable ONLY once a
  # real approval mechanism exists — flipping enabled:true today means ungated writes.
  k8s-remediation:
    enabled: false
    description: "Kubernetes write actions (non-destructive). Disabled: no working approval gate."
    tags: [cluster]
    tools:
      - name: restart_k8s_workload
        description: "Rolling-restart a deployment/statefulset/daemonset."
        command: "kubectl rollout restart {{ kind }}/{{ name }} -n {{ namespace }} --context={{ kube_context }}"
      - name: scale_k8s_workload
        description: "Set the replica count on a deployment/statefulset."
        command: "kubectl scale {{ kind }}/{{ name }} --replicas={{ replicas }} -n {{ namespace }} --context={{ kube_context }}"
      - name: rollback_k8s_workload
        description: "Roll a deployment back to its previous revision."
        command: "kubectl rollout undo deployment/{{ name }} -n {{ namespace }} --context={{ kube_context }}"
      - name: cordon_k8s_node
        description: "Mark a node unschedulable (no eviction)."
        command: "kubectl cordon {{ node }} --context={{ kube_context }}"
      - name: uncordon_k8s_node
        description: "Mark a node schedulable again."
        command: "kubectl uncordon {{ node }} --context={{ kube_context }}"

  kubernetes/core:
    enabled: false
  kubernetes/kube-prometheus-stack:
    enabled: false
  kubernetes/live-metrics:
    enabled: false
  kubernetes/krew-extras:
    enabled: false
  kubernetes/logs:
    enabled: false

  prometheus/metrics:
    enabled: true
    config:
      prometheus_url: $PROMETHEUS_URL
      healthcheck: "api/v1/query?query=up"
      additional_headers:
        Authorization: Bearer $GRAFANA_TOKEN

  grafana/loki:
    enabled: false # via mcp-grafana
  grafana/dashboards:
    enabled: false # via mcp-grafana

  grafana/tempo:
    enabled: true
    config:
      api_url: $GRAFANA_URL
      api_key: $GRAFANA_TOKEN
      grafana_datasource_uid: $TEMPO_DATASOURCE_UID

  kubernetes:
    description: "Read access to cluster resources (excluding secrets and other sensitive data)"
    docs_url: "https://holmesgpt.dev/data-sources/builtin-toolsets/kubernetes/"
    icon_url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPKA-U9m5BxYQDF1O7atMfj9EMMXEoGu4t0Q&s"
    tags:
      - core
    prerequisites:
      - command: "kubectl version --client"
    tools:
      - name: "kubectl_describe"
        description: >
          Run kubectl describe <kind> <name> -n <namespace>,
          call this when users ask for description,
          for example when a user asks
            - 'describe pod xyz-123'
            - 'show service xyz-123 in namespace my-ns'
        command: "kubectl --context {{ environment }} describe {{ kind }} {{ name }}{% if namespace %} -n {{ namespace }}{% endif %}"
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: |
                Summarize this kubectl describe output focusing on:
                - What needs attention or immediate action
                - Resource status and health indicators
                - Any errors, warnings, or non-standard states
                - Key configuration details that could affect functionality
                - When possible, mention exact field names so the user can grep for specific details
                - Be concise: aim for ≤ 50% of the original length; avoid repeating defaults/healthy/unchanged details
                - Prefer aggregates and counts; list only outliers and actionable items
                - Keep grep-friendly: include exact field names/values that matter

      - name: "kubectl_get_by_name"
        description: "Run `kubectl get <kind> <name> --show-labels`"
        command: "kubectl --context {{ environment }} get --show-labels -o wide {{ kind }} {{ name }}{% if namespace %} -n {{ namespace }}{% endif %}"

      - name: "kubectl_get_by_kind_in_namespace"
        description: "Run `kubectl get <kind> -n <namespace> --show-labels` to get all resources of a given type in namespace"
        command: "kubectl --context {{ environment }} get --show-labels -o wide {{ kind }} -n {{namespace}}"
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: |
                Summarize this kubectl output focusing on:
                - What needs attention or immediate action
                - Group similar resources into aggregate descriptions
                - Make sure to mention outliers, errors, and non-standard states
                - List healthy resources as aggregate descriptions
                - When possible, mention exact keywords so the user can rerun the command with | grep <keyword> and drill down
                - Be concise: target ≤ 50% of input size; prefer counts + outliers over full listings

      - name: "kubectl_get_by_kind_in_cluster"
        description: "Run `kubectl get -A <kind> --show-labels` to get all resources of a given type in the cluster"
        command: "kubectl --context {{ environment }} get -A --show-labels -o wide {{ kind }}"
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: |
                Summarize this kubectl output focusing on:
                - What needs attention or immediate action
                - Group similar resources into a single line and description
                - Make sure to mention outliers, errors, and non-standard states
                - When possible, mention exact keywords so the user can rerun the command with | grep <keyword>
                - Strive for ≤ 50% of the original size; keep results compact and grep-friendly

      - name: "kubectl_find_resource"
        description: "Run `kubectl get {{ kind }} -A --show-labels | grep {{ keyword }}` to find a resource where you know a substring of the name, IP, namespace, or labels"
        command: "kubectl --context {{ environment }} get -A --show-labels -o wide {{ kind }} | grep {{ keyword }}"

      - name: "kubectl_get_yaml"
        description: "Run `kubectl get -o yaml` on a single Kubernetes resource"
        command: "kubectl --context {{ environment }} get -o yaml {{ kind }} {{ name }}{% if namespace %} -n {{ namespace }}{% endif %}"

      - name: "kubectl_events"
        description: "Retrieve the events for a specific Kubernetes resource. `resource_type` can be any kubernetes resource type: 'pod', 'service', 'deployment', 'job', 'node', etc."
        command: "kubectl --context {{ environment }} events --for {{resource_type}}/{{ resource_name }}{% if namespace %} -n {{ namespace }}{% endif %}"

      - name: "kubernetes_jq_query"
        user_description: "Query Kubernetes Resources: kubectl get {{kind}} --all-namespaces -o json | jq -r {{jq_expr}}"
        description: >
          Use kubectl to get json for all resources of a specific kind and filter with jq.
          IMPORTANT: The 'kind' parameter must be the plural form of the resource type
          (e.g., use "pods" not "pod", "services" not "service", "jobs" not "job").
          Do not worry about escaping the jq_expr - it will be done by the system.
          Example: .items[] | .spec.containers[].image | select(test("^gcr.io/") | not)
        script: |
          #!/bin/bash
          API_INFO=$(kubectl --context {{ environment }} api-resources --no-headers | grep "^{{ kind }} " | head -1)
          [ -z "$API_INFO" ] && { echo "Error: Unable to find resource kind '{{ kind }}'" >&2; exit 1; }
          if [[ "$API_INFO" == *" true "* ]]; then PREFIX=$(echo "$API_INFO" | sed 's/ true .*//');
          elif [[ "$API_INFO" == *" false "* ]]; then PREFIX=$(echo "$API_INFO" | sed 's/ false .*//');
          else echo "Error: Could not parse NAMESPACED field" >&2; exit 1; fi
          PREFIX=$(echo "$PREFIX" | sed 's/  *$//' | sed 's/  */ /g')
          IFS=' ' read -ra F <<< "$PREFIX"
          RESOURCE_NAME="${F[0]}"; API_VERSION="${F[$((${#F[@]} - 1))]}"
          [ -z "$API_VERSION" ] || [ -z "$RESOURCE_NAME" ] && { echo "Error: Unable to parse API info" >&2; exit 1; }
          [[ "$API_VERSION" == "v1" ]] && API_PATH="/api/v1/${RESOURCE_NAME}" || API_PATH="/apis/${API_VERSION}/${RESOURCE_NAME}"
          LIMIT=500; CONTINUE=""; PROCESSED=0; TOTAL_MATCHES=0
          while true; do
            [ -z "$CONTINUE" ] && QUERY="${API_PATH}?limit=${LIMIT}" || QUERY="${API_PATH}?limit=${LIMIT}&continue=${CONTINUE}"
            OUTPUT=$(kubectl --context {{ environment }} get --raw "$QUERY" 2>&1); exit_code=$?
            [ $exit_code -ne 0 ] && { echo "Error: $OUTPUT" >&2; exit $exit_code; }
            ITEMS_COUNT=$(echo "$OUTPUT" | jq '.items | length')
            MATCHES=$(echo "$OUTPUT" | jq -r {{ jq_expr }} 2>&1); jq_exit=$?
            [ $jq_exit -ne 0 ] && { echo "Error: jq failed: $MATCHES" >&2; exit $jq_exit; }
            if [ "$ITEMS_COUNT" -gt 0 ] && [ -n "$MATCHES" ]; then
              echo "$MATCHES"
              MATCH_COUNT=$(echo "$MATCHES" | grep -c . || true)
              TOTAL_MATCHES=$((TOTAL_MATCHES + MATCH_COUNT))
            fi
            PROCESSED=$((PROCESSED + ITEMS_COUNT))
            CONTINUE=$(echo "$OUTPUT" | jq -r '.metadata.continue // empty')
            [ -z "$CONTINUE" ] && break
          done
          echo "Total: $PROCESSED items, $TOTAL_MATCHES matches" >&2
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 10000
              prompt: |
                Summarize this jq query output focusing on:
                - Key patterns and commonalities in the data
                - Notable outliers, anomalies, or items that need attention
                - Group similar results into aggregate descriptions when possible
                - Highlight any empty results, null values, or missing data
                - Be concise: aim for ≤ 50% of the original text; prioritize aggregates and actionable outliers

      - name: "kubernetes_tabular_query"
        user_description: "Tabular output of specific fields: kubectl get {{kind}} --all-namespaces -o custom-columns={{columns}}"
        description: >
          Extract specific fields from Kubernetes resources in tabular format with optional filtering.
          Memory-efficient way to query large clusters - only requested fields are transmitted.
          Column specification format: HEADER:FIELD_PATH,HEADER2:FIELD_PATH2,...
          Optional filtering parameter: filter_pattern (supports grep regex)
          Note: not allowed characters are: ' / ; and newline
        command: kubectl --context {{ environment }} get {{ kind }} --all-namespaces -o custom-columns='{{ columns }}'{% if filter_pattern %} | (read -r header; echo "$header"; grep -E '{{ filter_pattern }}'){% endif %}
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 10000
              prompt: |
                Summarize this tabular output focusing on:
                - Resources that need attention (errors, pending, failures)
                - Group similar items into aggregate descriptions
                - Highlight outliers or unusual values
                - Be concise: aim for ≤ 50% of the original size

      - name: "kubernetes_count"
        user_description: "Count Kubernetes Resources: kubectl get {{kind}} --all-namespaces -o json | jq -c -r {{ jq_expr }}"
        description: >
          Use kubectl to apply a jq filter and count the results.
          IMPORTANT: The 'kind' parameter must be the plural form of the resource type.
          Use select() to filter objects before extracting properties.
        script: |
          #!/bin/bash
          API_INFO=$(kubectl --context {{ environment }} api-resources --no-headers | grep "^{{ kind }} " | head -1)
          [ -z "$API_INFO" ] && { echo "Error: Unable to find resource kind '{{ kind }}'" >&2; exit 1; }
          if [[ "$API_INFO" == *" true "* ]]; then PREFIX=$(echo "$API_INFO" | sed 's/ true .*//');
          elif [[ "$API_INFO" == *" false "* ]]; then PREFIX=$(echo "$API_INFO" | sed 's/ false .*//');
          else echo "Error: Could not parse NAMESPACED field" >&2; exit 1; fi
          PREFIX=$(echo "$PREFIX" | sed 's/  *$//' | sed 's/  */ /g')
          IFS=' ' read -ra F <<< "$PREFIX"
          RESOURCE_NAME="${F[0]}"; API_VERSION="${F[$((${#F[@]} - 1))]}"
          [[ "$API_VERSION" == "v1" ]] && API_PATH="/api/v1/${RESOURCE_NAME}" || API_PATH="/apis/${API_VERSION}/${RESOURCE_NAME}"
          LIMIT=500; CONTINUE=""; ALL_MATCHES=""; TOTAL_PROCESSED=0
          while true; do
            [ -z "$CONTINUE" ] && QUERY="${API_PATH}?limit=${LIMIT}" || QUERY="${API_PATH}?limit=${LIMIT}&continue=${CONTINUE}"
            OUTPUT=$(kubectl --context {{ environment }} get --raw "$QUERY" 2>&1); exit_code=$?
            [ $exit_code -ne 0 ] && { echo "Error: $OUTPUT" >&2; exit $exit_code; }
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + $(echo "$OUTPUT" | jq '.items | length')))
            BATCH=$(echo "$OUTPUT" | jq -c -r {{ jq_expr }} 2>&1); jq_exit=$?
            [ $jq_exit -ne 0 ] && { echo "Error: jq failed: $BATCH" >&2; exit $jq_exit; }
            [ -n "$BATCH" ] && { [ -z "$ALL_MATCHES" ] && ALL_MATCHES="$BATCH" || ALL_MATCHES="$ALL_MATCHES"$'\n'"$BATCH"; }
            CONTINUE=$(echo "$OUTPUT" | jq -r '.metadata.continue // empty')
            [ -z "$CONTINUE" ] && break
          done
          filtered=$(echo "$ALL_MATCHES" | grep -v '^$' | grep -v '^null$')
          [ -z "$filtered" ] && count=0 || count=$(echo "$filtered" | wc -l)
          echo "$count results"
          echo "Preview (up to 10):"; echo "$filtered" | head -n 10 | cut -c 1-200 | nl
          echo "Total processed: $TOTAL_PROCESSED" >&2

  aws:
    description: "Read access to AWS resources using the AWS CLI"
    docs_url: "https://docs.aws.amazon.com/cli/latest/"
    icon_url: "https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
    tags:
      - core
      - cli
    prerequisites:
      - command: "aws --version"
      - command: "aws sts get-caller-identity"
    tools:
      - name: "aws_ec2_describe_instances"
        description: "List EC2 instances with their status, type, and tags. Optional filters: instance_ids, state, tag_key, tag_value"
        command: >
          aws --profile {{ environment }} ec2 describe-instances
          {% if instance_ids %}--instance-ids {{ instance_ids }}{% endif %}
          {% if state %}--filters "Name=instance-state-name,Values={{ state }}"{% endif %}
          {% if tag_key and tag_value %}--filters "Name=tag:{{ tag_key }},Values={{ tag_value }}"{% endif %}
          --output json | jq -r '.Reservations[].Instances[] | {InstanceId, State: .State.Name, InstanceType, LaunchTime, PrivateIpAddress, PublicIpAddress, Tags}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize EC2 instances: highlight stopped/unusual states, group by type/AZ, flag security concerns. ≤50% length."

      - name: "aws_ec2_list_security_groups"
        description: "List VPC security groups with their rules"
        command: >
          aws --profile {{ environment }} ec2 describe-security-groups
          {% if group_ids %}--group-ids {{ group_ids }}{% endif %}
          {% if vpc_id %}--filters "Name=vpc-id,Values={{ vpc_id }}"{% endif %}
          --output json | jq -r '.SecurityGroups[] | {GroupId, GroupName, Description, VpcId, IpPermissions, IpPermissionsEgress}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize security groups: flag overly permissive rules (0.0.0.0/0), unusual configs. Be concise."

      - name: "aws_ec2_describe_network_interfaces"
        description: "List or search for network interfaces (ENIs) by interface ID, private IP, or VPC ID."
        command: >
          aws --profile {{ environment }} ec2 describe-network-interfaces
          {% if interface_ids %}--network-interface-ids {{ interface_ids }}{% endif %}
          {% if private_ip %}--filters "Name=private-ip-address,Values={{ private_ip }}"{% endif %}
          {% if vpc_id %}--filters "Name=vpc-id,Values={{ vpc_id }}"{% endif %}
          --output json | jq -r '.NetworkInterfaces[] | {NetworkInterfaceId, PrivateIpAddress, Status, Description, SubnetId, VpcId, Groups, Attachment}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize ENIs: which instances/services use each, security groups, unusual/detached interfaces."

      - name: "aws_iam_list_roles"
        description: "List IAM roles with their policies (read-only)"
        command: >
          aws --profile {{ environment }} iam list-roles --output json | jq -r '.Roles[] | {RoleName, Arn, CreateDate, Description, AssumeRolePolicyDocument}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize IAM roles: flag broad permissions, group by service/purpose. ≤50% length."

      - name: "aws_iam_get_role"
        description: "Get details of a specific IAM role including attached policies"
        command: >
          aws --profile {{ environment }} iam get-role --role-name {{ role_name }} --output json &&
          aws --profile {{ environment }} iam list-attached-role-policies --role-name {{ role_name }} --output json &&
          aws --profile {{ environment }} iam list-role-policies --role-name {{ role_name }} --output json

      - name: "aws_iam_get_policy"
        description: "Get a managed IAM policy document by policy ARN."
        command: >
          POLICY_VERSION=$(aws --profile {{ environment }} iam get-policy --policy-arn {{ policy_arn }} --output json | jq -r '.Policy.DefaultVersionId') &&
          aws --profile {{ environment }} iam get-policy-version --policy-arn {{ policy_arn }} --version-id $POLICY_VERSION --output json

      - name: "aws_ce_get_cost_and_usage"
        description: "Get AWS cost and usage data for a time period (default: last 30 days), daily by service."
        command: >
          START_DATE=$(date -u -d '{{ days | default("30") }} days ago' +%Y-%m-%d) &&
          END_DATE=$(date -u +%Y-%m-%d) &&
          aws --profile {{ environment }} ce get-cost-and-usage
          --time-period Start=$START_DATE,End=$END_DATE
          --granularity DAILY --metrics BlendedCost UnblendedCost
          --group-by Type=DIMENSION,Key=SERVICE --output json
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize AWS costs: total, top 10 services, spikes, day-over-day trends."

      - name: "aws_ce_get_cost_by_service"
        description: "Get total AWS costs grouped by service (default: last 30 days), sorted by amount."
        command: >
          START_DATE=$(date -u -d '{{ days | default("30") }} days ago' +%Y-%m-%d) &&
          END_DATE=$(date -u +%Y-%m-%d) &&
          aws --profile {{ environment }} ce get-cost-and-usage
          --time-period Start=$START_DATE,End=$END_DATE
          --granularity MONTHLY --metrics BlendedCost
          --group-by Type=DIMENSION,Key=SERVICE --output json |
          jq -r '.ResultsByTime[0].Groups | sort_by(.Metrics.BlendedCost.Amount | tonumber) | reverse | .[] | {Service: .Keys[0], Cost: .Metrics.BlendedCost.Amount, Unit: .Metrics.BlendedCost.Unit}'

      - name: "aws_ce_get_cost_by_tag"
        description: "Get AWS costs grouped by a specific tag key (e.g., 'env', 'service_id', 'team')."
        command: >
          START_DATE=$(date -u -d '{{ days | default("30") }} days ago' +%Y-%m-%d) &&
          END_DATE=$(date -u +%Y-%m-%d) &&
          aws --profile {{ environment }} ce get-cost-and-usage
          --time-period Start=$START_DATE,End=$END_DATE
          --granularity MONTHLY --metrics BlendedCost
          --group-by Type=TAG,Key={{ tag_key }} --output json |
          jq -r '.ResultsByTime[0].Groups | sort_by(.Metrics.BlendedCost.Amount | tonumber) | reverse | .[] | {Tag: .Keys[0], Cost: .Metrics.BlendedCost.Amount, Unit: .Metrics.BlendedCost.Unit}'

      - name: "aws_s3_bucket_info"
        description: "Get S3 bucket details: location, versioning, encryption, public access settings"
        command: >
          echo "=== Location ===" && aws --profile {{ environment }} s3api get-bucket-location --bucket {{ bucket_name }} &&
          echo "=== Versioning ===" && aws --profile {{ environment }} s3api get-bucket-versioning --bucket {{ bucket_name }} &&
          echo "=== Encryption ===" && (aws --profile {{ environment }} s3api get-bucket-encryption --bucket {{ bucket_name }} 2>/dev/null || echo "No encryption configured") &&
          echo "=== Public Access ===" && (aws --profile {{ environment }} s3api get-public-access-block --bucket {{ bucket_name }} 2>/dev/null || echo "No public access block configured")

      - name: "aws_s3_list_objects"
        description: "List objects in an S3 bucket with optional prefix filtering. Returns up to 1000 objects by default."
        command: >
          aws --profile {{ environment }} s3api list-objects-v2 --bucket {{ bucket_name }}
          {% if prefix %}--prefix {{ prefix }}{% endif %}
          {% if max_keys %}--max-items {{ max_keys }}{% else %}--max-items 1000{% endif %}
          --output json | jq -r '.Contents[]? | {Key, Size, LastModified, StorageClass}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 2000
              prompt: "Summarize S3 objects: count, size distribution, file types, recently modified, unusual storage classes. ≤50% length."

      - name: "aws_s3_bucket_size"
        description: "Get total size and object count of an S3 bucket (CloudWatch metrics, up to 24h old)"
        command: >
          aws --profile {{ environment }} cloudwatch get-metric-statistics
          --namespace AWS/S3 --metric-name BucketSizeBytes
          --dimensions Name=BucketName,Value={{ bucket_name }} Name=StorageType,Value=StandardStorage
          --start-time $(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%S)
          --end-time $(date -u +%Y-%m-%dT%H:%M:%S)
          --period 86400 --statistics Average --output json |
          jq -r '.Datapoints | sort_by(.Timestamp) | .[-1] | {Timestamp, SizeBytes: .Average, SizeGB: (.Average / 1073741824 | round)}'

      - name: "aws_rds_list_instances"
        description: "List all RDS database instances with status, engine, and size"
        command: >
          aws --profile {{ environment }} rds describe-db-instances --output json |
          jq -r '.DBInstances[] | {DBInstanceIdentifier, DBInstanceClass, Engine, EngineVersion, DBInstanceStatus, Endpoint: .Endpoint.Address, AvailabilityZone, MultiAZ, StorageType, AllocatedStorage, BackupRetentionPeriod}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize RDS instances: flag issues, outdated engines, backup concerns. Group by engine type. ≤50% length."

      - name: "aws_rds_list_snapshots"
        description: "List RDS snapshots for a specific database instance or all snapshots."
        command: >
          aws --profile {{ environment }} rds describe-db-snapshots
          {% if db_instance_id %}--db-instance-identifier {{ db_instance_id }}{% endif %}
          --output json |
          jq -r '.DBSnapshots[] | {DBSnapshotIdentifier, DBInstanceIdentifier, SnapshotCreateTime, Status, Engine, AllocatedStorage, SnapshotType}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize RDS snapshots: recent status, failed snapshots, age/retention patterns."

      - name: "aws_lambda_list_functions"
        description: "List all Lambda functions with their runtime, memory, and timeout configuration"
        command: >
          aws --profile {{ environment }} lambda list-functions --output json |
          jq -r '.Functions[] | {FunctionName, Runtime, Handler, MemorySize, Timeout, LastModified, CodeSize, State, LastUpdateStatus}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize Lambda functions: flag issues, deprecated runtimes, large sizes. ≤50% length."

      - name: "aws_lambda_get_policy"
        description: "Get the resource-based policy for a Lambda function (shows who can invoke it)"
        command: >
          aws --profile {{ environment }} lambda get-policy --function-name {{ function_name }} --output json 2>/dev/null | jq -r '.Policy | fromjson' || echo "No policy configured"

      - name: "aws_cloudwatch_list_log_groups"
        description: "List CloudWatch log groups with retention settings and storage size"
        command: >
          aws --profile {{ environment }} logs describe-log-groups --output json |
          jq -r '.logGroups[] | {logGroupName, retentionInDays, storedBytes: (.storedBytes // 0), creationTime: (.creationTime / 1000 | todate)}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize log groups: flag no-retention (cost risk), large groups, group by service."

      - name: "aws_cloudwatch_tail_logs"
        description: "Get recent log events from a CloudWatch log group. Returns up to 100 events (truncated to 300 chars). Optional: log_stream_name, hours (default 0.25)"
        command: >
          aws --profile {{ environment }} logs filter-log-events
          --log-group-name {{ log_group_name }}
          {% if log_stream_name %}--log-stream-names {{ log_stream_name }}{% endif %}
          --start-time $(($(date +%s) - {{ hours | default('0.25') }} * 3600))000
          --max-items 100 --output json |
          jq '[.events[0:100] | .[] | {timestamp: (.timestamp / 1000 | todate), line: (.message | if length > 300 then .[0:300] + "..." else . end)}]'

      - name: "aws_cloudwatch_query_logs"
        description: >
          Search CloudWatch log events with optional pattern filtering. Returns up to 100 matching events.
          Optional: filter_pattern (e.g., "ERROR", "?ERROR ?FATAL"), hours (default 0.25)
          Pattern syntax: space-separated terms (AND), ? prefix for OR logic
        command: |
          aws --profile {{ environment }} logs filter-log-events \
            --log-group-name '{{ log_group_name }}' \
            --start-time $(($(date +%s) - {{ hours | default('0.25') }} * 3600))000 \
            --max-items 100{% if log_stream_name %} \
            --log-stream-names '{{ log_stream_name }}'{% endif %}{% if filter_pattern %} \
            --filter-pattern '{{ filter_pattern }}'{% endif %} \
            --output json | \
          jq '[.events[0:100] | .[] | {timestamp: (.timestamp / 1000 | todate), line: (.message | if length > 300 then .[0:300] + "..." else . end)}]'

      - name: "aws_ecr_list_repositories"
        description: "List all ECR repositories in the account"
        command: >
          aws --profile {{ environment }} ecr describe-repositories --output json |
          jq -r '.repositories[] | {repositoryName, repositoryUri, createdAt, imageTagMutability, imageScanningConfiguration}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize ECR repos: count, scanning config, tag mutability, group by prefix."

      - name: "aws_ecr_list_images"
        description: "List images in an ECR repository. Optional: filter (TAGGED, UNTAGGED)"
        command: >
          aws --profile {{ environment }} ecr list-images --repository-name {{ repository_name }}
          {% if filter %}--filter tagStatus={{ filter }}{% endif %}
          --output json | jq -r '.imageIds[] | {imageDigest, imageTag}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1500
              prompt: "Summarize images: tagged vs untagged count, cleanup candidates, tag patterns."

      - name: "aws_ecr_describe_images"
        description: "Get detailed information about images in an ECR repository including size, push date, and scan findings"
        command: >
          aws --profile {{ environment }} ecr describe-images --repository-name {{ repository_name }}
          {% if image_ids %}--image-ids {{ image_ids }}{% endif %}
          --output json |
          jq -r '.imageDetails[] | {imageTags, imagePushedAt, imageSizeInBytes, imageScanStatus, imageScanFindingsSummary}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1500
              prompt: "Summarize image details: recent pushes, old images, large sizes, scan findings."

      - name: "aws_elasticache_list_clusters"
        description: "List ElastiCache Redis and Memcached clusters"
        command: >
          aws --profile {{ environment }} elasticache describe-cache-clusters --output json |
          jq -r '.CacheClusters[] | {CacheClusterId, CacheNodeType, Engine, EngineVersion, CacheClusterStatus, NumCacheNodes, PreferredAvailabilityZone}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize ElastiCache clusters: flag unavailable, outdated engines, group by engine/status."

      - name: "aws_memorydb_list_clusters"
        description: "List MemoryDB for Redis clusters"
        command: >
          aws --profile {{ environment }} memorydb describe-clusters --output json |
          jq -r '.Clusters[] | {Name, Status, NodeType, Engine, EngineVersion, NumberOfShards, TLSEnabled, SubnetGroupName, SecurityGroups, SnapshotRetentionLimit}'
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 1000
              prompt: "Summarize MemoryDB clusters: status, engine versions, TLS/security settings, backup config."
