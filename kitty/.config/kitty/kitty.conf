linux_display_server x11

# BEGIN_KITTY_FONTS
# Font ligatures settings for Jet Brains Mono Font:
# https://github.com/JetBrains/JetBrainsMono/wiki/OpenType-features
font_family      family='JetBrainsMono Nerd Font Propo' style=Light features='+zero +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
bold_font        family='JetBrainsMono Nerd Font Propo' style=Bold features='+zero +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
italic_font      family='JetBrainsMono Nerd Font Propo' style='Light Italic' features='+zero +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
bold_italic_font family='JetBrainsMono Nerd Font Propo' style='Bold Italic' features='+zero +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
font_size        15.0
modify_font cell_height 120%
font_features JetBrainsMono +liga
# END_KITTY_FONTS

# BEGIN_KITTY_SYMBOL_MAPS
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
# END_KITTY_SYMBOL_MAPS

disable_ligatures never

url_style curly

# Windows
map opt+enter new_window_with_cwd
map opt+w close_window

map opt+left neighboring_window left
map opt+right neighboring_window right
map opt+up neighboring_window up
map opt+down neighboring_window down

map opt+r move_window_backward
map opt+shift+r move_window_forward

# Tabs
map opt+shift+t new_tab_with_cwd
map opt+shift+w close_tab

map opt+tab next_tab
map opt+shift+tab previous_tab

# Full screen
map opt+shift+z toggle_layout stack

map cmd+w no_op

# Delete word backward
map cmd+backspace send_text all \x17

# Word navigation
map cmd+left send_text all \x1bb
map cmd+right send_text all \x1bf

cursor_shape beam
cursor_beam_thickness 1.8
window_padding_width 20

mouse_hide_wait 3.0
detect_urls yes
open_url_with /usr/bin/open

repaint_delay 10
input_delay 3
sync_to_monitor yes

tab_bar_style               powerline
tab_bar_edge                bottom
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

background_opacity 0.80
dynamic_background_opacity yes
background_blur 64


hide_window_decorations titlebar-only
#shell zsh

macos_quit_when_last_window_closed yes
macos_colorspace displayp3

# BEGIN_KITTY_THEME
# Catppuccin-light-tanx
include current-theme.conf
# END_KITTY_THEME
